# TAP compliance_core plugin — package-mode distribution (2026-07-08).
# Identity (conformance gate): slug "compliance_core" == dist "compliance-core-tap" ==
# namespace "tap_plugin.compliance_core" == entry-point key. NOT a uv.workspace member.
# Regime-agnostic compliance vocabulary substrate; fedramp_20x_ksi/roscale/samsite depend
# on it downward. Spec: plugins/compliance_core/specs/spec-compliance-core-v0.md.
[project]
name = "compliance-core-tap"
description = "TAP Compliance Core plugin — regime-agnostic compliance vocabulary (artifacts, context, evidence, findings, exceptions, boundaries)."
requires-python = ">=3.14"
dynamic = ["version"]
dependencies = []

[project.entry-points."tap.plugins"]
compliance_core = "tap_plugin.compliance_core.apps:ComplianceCoreConfig"

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
only-include = ["tap_plugin/compliance_core"]
